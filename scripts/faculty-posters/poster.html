<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:720px;height:1280px;overflow:hidden;background:#000}
.card{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(115deg,{{c1}} 0%,{{c2}} 100%)}
.halo{position:absolute;left:50%;top:62%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.16),rgba(255,255,255,0))}
.logo{position:absolute;top:150px;left:50%;transform:translateX(-50%);height:58px}
.title{position:absolute;top:248px;left:24px;right:24px;text-align:center;color:#fff;font:800 {{size}}px/0.98 "Plus Jakarta Sans";letter-spacing:-.035em;text-transform:uppercase;
 background:linear-gradient(180deg,#fff 30%,#d9dde4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25))}
.title span{display:block}
.person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:{{pw}}px;max-width:none;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
.foot{position:absolute;inset:auto 0 0 0;height:180px;background:linear-gradient(0deg,rgba(0,0,0,.25),rgba(0,0,0,0))}
</style></head><body><div class="card">
<div class="halo"></div>
<img class="logo" src="logo.png">
<div class="title">{{lines}}</div>
<img class="person" src="p/{{img}}.png">
<div class="foot"></div>
</div></body></html>
