<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:720px;height:1280px;overflow:hidden;background:#000}
.card{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(125deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.03) 32%,rgba(255,255,255,0) 50%),linear-gradient(180deg,#040405 0%,#08080a 70%,rgba(20,21,24,.96) 100%)}
.bands{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0px,rgba(255,255,255,.06) 28px,rgba(255,255,255,.015) 62px,rgba(0,0,0,.3) 95px,rgba(255,255,255,0) 124px);filter:blur(8px)}
.halo{position:absolute;left:50%;top:62%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.07),rgba(255,255,255,0))}
.person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:860px;max-width:none;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
.foot{position:absolute;inset:auto 0 0 0;height:420px;background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
</style></head><body><div class="card">
<div class="bands"></div>
<div class="halo"></div>
<img class="person" src="p/{{img}}.png">
<div class="foot"></div>
</div></body></html>
