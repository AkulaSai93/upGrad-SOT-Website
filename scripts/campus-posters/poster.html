<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;overflow:hidden;font-family:"Plus Jakarta Sans";background:#0b0d12}
.stage{position:relative;width:100%;height:100%;overflow:hidden}
.photo{position:absolute;inset:0;background:url({{photo}}) {{pos}}/cover no-repeat;filter:saturate(1.15) contrast(1.05)}
.shade{position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(11,13,18,.96) 0%,rgba(11,13,18,.88) 30%,rgba(11,13,18,.35) 58%,rgba(11,13,18,0) 75%),
 linear-gradient(0deg,rgba(11,13,18,.7) 0%,rgba(11,13,18,0) 35%)}
.logo{position:absolute;top:56px;left:72px;height:62px}
.copy{position:absolute;left:72px;top:50%;transform:translateY(-50%);width:880px}
.tag{display:inline-flex;align-items:center;gap:12px;padding:10px 20px;border:2px solid rgba(255,255,255,.35);border-radius:999px;color:#fff;font:700 24px "Plus Jakarta Sans";letter-spacing:.14em;text-transform:uppercase}
.tag i{width:12px;height:12px;border-radius:50%;background:#e4002b;display:block}
.city{font:800 188px/0.86 "Plus Jakarta Sans";letter-spacing:-.05em;color:#fff}
.campus{display:inline-block;margin-top:18px;padding:8px 26px 14px;background:#e4002b;color:#fff;font:italic 800 84px/1 "Plus Jakarta Sans";letter-spacing:-.02em;transform:rotate(-2deg);box-shadow:10px 10px 0 #fff}
.sub{margin-top:38px;color:rgba(255,255,255,.85);font:600 30px "Plus Jakarta Sans"}
.chips{position:absolute;left:72px;bottom:64px;display:flex;gap:16px}
.chip{display:flex;align-items:center;gap:12px;padding:16px 26px;border-radius:10px;background:#fff;color:#0b0d12;font:800 28px "Plus Jakarta Sans"}
.chip.dark{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.3);backdrop-filter:blur(8px)}
.chip b{color:#e4002b}
.star{position:absolute;width:56px;height:56px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.uni{position:absolute;right:56px;top:56px;max-width:560px;text-align:right;color:#fff;font:700 24px/1.3 "Plus Jakarta Sans";padding:14px 22px;border-radius:10px;background:rgba(11,13,18,.55);backdrop-filter:blur(10px)}
.uni small{display:block;font:600 16px "Plus Jakarta Sans";letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:4px}
</style></head><body><div class="stage">
<div class="photo"></div><div class="shade"></div>
<div class="copy">
 <div class="city">{{city}}</div>
 <div class="campus">Campus</div>
</div>
<span class="star" style="left:{{sx}}px;top:270px"></span>
<span class="star" style="left:calc({{sx}}px + 62px);top:338px;width:28px;height:28px;background:#e4002b"></span>
</div></body></html>
